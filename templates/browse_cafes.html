<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Cafes</title>
  <style>

/* Browse Cafés — aligned with the CaféQuick homepage */
:root {
  color-scheme: dark;
  --background: #101112;
  --surface: #1b1d1e;
  --surface-light: #292c2d;
  --cream: #ffffff;
  --muted: #c7c9c7;
  --accent: #b8ff45;
  --accent-hover: #ccff78;
  --border: rgba(255, 255, 255, 0.14);
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 48px 24px;
  font-family: Arial, sans-serif;
  color: var(--cream);
  background:
    radial-gradient(
      circle at 78% 30%,
      rgba(137, 84, 46, 0.24),
      transparent 42%
    ),
    var(--background);
}

.container {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: rgba(27, 29, 30, 0.88);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
}

h1 {
  margin: 0 0 28px;
  color: var(--cream);
  font-size: clamp(2rem, 4vw, 2.8rem);
  line-height: 1.2;
  text-align: center;
}

.page-nav {
  display: flex;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}

.home-link {
  display: inline-block;
  padding: 10px 16px;
  color: var(--accent);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
  transition: background 0.2s ease, color 0.2s ease;
}

.home-link:hover {
  color: #101112;
  background: var(--accent);
}

.home-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.scroll-container {
  display: flex;
  gap: 20px;
  max-width: 100%;
  padding: 8px 4px 20px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scroll-snap-type: x proximity;
}

.scroll-container::-webkit-scrollbar {
  height: 6px;
}

.scroll-container::-webkit-scrollbar-thumb {
  background: #555950;
  border-radius: 10px;
}

.image-item {
  width: 100%;
  min-width: 0;
  position: relative;
  padding: 0 0 20px;
  overflow: hidden;
  text-align: center;
  white-space: normal;
  background: var(--surface-light);
  border: 1px solid var(--border);
  border-radius: 12px;
  scroll-snap-align: start;
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.image-item:hover {
  transform: translateY(-4px);
  border-color: rgba(184, 255, 69, 0.55);
}

.image-item > img {
  display: block;
  width: 100%;
  height: 155px;
  object-fit: cover;
  border-radius: 0;
}

.image-item p {
  min-height: 48px;
  margin: 18px 12px 10px;
  color: var(--cream);
  font-size: 1.05rem;
  font-weight: bold;
  line-height: 1.5;
}



.menu-button {
  display: inline-block;
  margin-top: 8px;
  padding: 11px 18px;
  color: #101112;
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

.add-cart-shortcut {
  margin-left: 8px;
  color: var(--accent);
  background: transparent;
  border-color: var(--accent);
}

.add-cart-shortcut:hover {
  color: #101112;
  background: var(--accent-hover);
}
.menu-button:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
}

.menu-button:focus-visible,
.scroll-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.scroll-btn {
  position: absolute;
  z-index: 1;
  top: 50%;
  width: 40px;
  height: 40px;
  transform: translateY(-50%);
  color: var(--accent);
  background: var(--surface-light);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.scroll-btn:hover {
  background: #383c37;
}

.left-btn {
  left: 8px;
}

.right-btn {
  right: 8px;
}


.scroll-container {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  width: 100%;
  padding: 8px 4px 20px;
}

@media (max-width: 700px) {
  .scroll-container {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }
}

@media (max-width: 460px) {
  .scroll-container {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  body {
    padding: 24px 14px;
  }

  .container {
    padding: 22px 14px;
  }

  .image-item {
    width: 100%;
    min-width: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}


.cafe-search {
  margin: 0 0 28px;
}

.cafe-search label {
  display: block;
  margin-bottom: 10px;
  color: var(--muted);
  font-weight: bold;
}

.search-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.search-controls input {
  flex: 1 1 220px;
  min-width: 0;
  padding: 12px 14px;
  color: var(--cream);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
}

.search-controls input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.search-controls .menu-button {
  margin-top: 0;
}

@media (max-width: 460px) {
  .search-controls > * {
    width: 100%;
  }
}

.nearby-controls {
  display: block;
  margin: 0 0 28px;
}


.nearby-controls button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 12px 20px;
  color: var(--cream);
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.13),
    rgba(120, 160, 100, 0.10)
  );
  border: 1px solid rgba(180, 210, 160, 0.55);
  border-radius: 999px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.20),
    0 4px 14px rgba(0, 0, 0, 0.18);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.nearby-controls button:hover {
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.19),
    rgba(120, 160, 100, 0.17)
  );
  border-color: rgba(200, 230, 180, 0.8);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 6px 18px rgba(0, 0, 0, 0.24);
  transform: translateY(-1px);
}

.nearby-controls button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.nearby-controls button:disabled {
  cursor: wait;
  opacity: 0.7;
  transform: none;
}


#nearby-status {
  margin-top: 10px;
  color: var(--muted);
}

  </style>
</head>

<body>

  <div class="container">
  <nav class="page-nav" aria-label="Page navigation">
     <a href="{{ url_for('index') }}" class="home-link">← Home</a>

     <a href="{{ url_for('view_cart') }}" class="home-link">View Cart</a>
</nav>
    <h1>Browse Cafes</h1>


<form class="cafe-search" action="{{ url_for('browse_cafes') }}" method="GET">
  <label for="cafe-search-input">Find your next coffee spot</label>

  <div class="search-controls">
    <input
      id="cafe-search-input"
      type="search"
      name="q"
      placeholder="Search cafés by name..."
      value="{{ search_query }}"
      aria-label="Search cafés by name"
    >
    <button class="menu-button" type="submit">Search</button>

    {% if search_query %}
      <a class="home-link" href="{{ url_for('browse_cafes') }}">Clear</a>
    {% endif %}
  </div>
</form>
<div class="nearby-controls">
  <button type="button" class="menu-button" id="find-nearby-btn">
  <span aria-hidden="true">⌖</span>
  Find Near Me
</button>
  <p role="status" aria-live="polite" id="nearby-status">
    Demo locations only — distances are illustrative.
  </p>
</div>

{% if not cafes %}
  <p role="status">No cafés found. Try another café name.</p>
{% endif %}

        <div class="scroll-container">

      {% for cafe in cafes %}
      <div
        class="image-item"
        data-latitude="{{ cafe.latitude }}"
        data-longitude="{{ cafe.longitude }}"
      >

        <img
          src="{{ url_for('static', filename='images/' ~ ({1: 'mphos-daily-grind.jpg', 2: 'thandis-brew-corner.jpg', 3: 'jabus-coffee-house.jpg', 4: 'leratos-coffee-garden.jpg', 5: 'soweto-sunrise-cafe.jpg', 6: 'ubuntu-bean-house.jpg'}[cafe.id])) }}"
          alt="{{ cafe.name }}">

        <p>{{ cafe.name }}</p>
        <a href="{{ url_for('view_menu', cafe_id=cafe.id) }}" class="menu-button">
          View Menu
        </a>
      </div>
      {% endfor %}
    </div>
    </div>
  </div>

    {% include '_chat_assistant.html' %}

<script>
(function () {
  const button = document.getElementById("find-nearby-btn");
  const status = document.getElementById("nearby-status");
  const container = document.querySelector(".scroll-container");

  if (!button || !status || !container) return;

  function distanceKm(lat1, lon1, lat2, lon2) {
    const radians = degrees => degrees * Math.PI / 180;
    const earthRadiusKm = 6371;

    const dLat = radians(lat2 - lat1);
    const dLon = radians(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(radians(lat1)) *
      Math.cos(radians(lat2)) *
      Math.sin(dLon / 2) ** 2;

    return earthRadiusKm * 2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );
  }

  button.addEventListener("click", function () {
    if (!navigator.geolocation) {
      status.textContent =
        "Your browser does not support location sharing.";
      return;
    }

    button.disabled = true;
    status.textContent = "Requesting your location…";

    navigator.geolocation.getCurrentPosition(
      function (position) {
        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        const cards = Array.from(
          container.querySelectorAll(".image-item")
        );

        cards.forEach(function (card) {
          const lat = Number(card.dataset.latitude);
          const lon = Number(card.dataset.longitude);

          const distance = distanceKm(
            userLat, userLon, lat, lon
          );

          let label = card.querySelector(".nearby-distance");

          if (!label) {
            label = document.createElement("p");
            label.className = "nearby-distance";
            label.setAttribute("aria-label", "Illustrative distance");
            const name = card.querySelector("p");
            if (name) {
              name.insertAdjacentElement("afterend", label);
            } else {
              card.prepend(label);
            }
          }

          label.textContent =
            "Illustrative distance: " + distance.toFixed(1) + " km";

          card.dataset.distance = distance;
        });

        cards.sort(function (a, b) {
          return Number(a.dataset.distance) -
                 Number(b.dataset.distance);
        });

        cards.forEach(card => container.appendChild(card));

        status.textContent =
          "Sorted by distance using your shared location. " +
          "Demo café coordinates are artificial, so these " +
          "distances are not real-world directions.";
        button.disabled = false;
      },
      function (error) {
        const messages = {
          1: "Location permission was denied. You can still search by café name.",
          2: "Your location is unavailable. Please try again.",
          3: "The location request timed out. Please try again."
        };

        status.textContent =
          messages[error.code] ||
          "We couldn't get your location. Please try again.";

        button.disabled = false;
      },
      {
        enableHighAccuracy: false,
        timeout: 10000,
        maximumAge: 60000
      }
    );
  });
})();
</script>

</body>

</html>
