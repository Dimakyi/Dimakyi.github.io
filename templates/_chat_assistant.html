
<link rel="stylesheet" href="{{ url_for('static', filename='css/cafe-assistant.css') }}">

<button
    id="cafe-assistant-toggle"
    type="button"
    aria-controls="cafe-assistant"
    aria-expanded="false"
    aria-label="Open CaféQuick Barista assistant">
    <span class="cafe-mascot" aria-hidden="true">☕</span>
    <span>CaféQuick Barista</span>
</button>

<section id="cafe-assistant" aria-labelledby="cafe-assistant-title" hidden>
    <header class="cafe-assistant-header">
        <span class="cafe-mascot cafe-mascot-header" aria-hidden="true">☕</span>
        <div class="cafe-assistant-brand">
            <h2 id="cafe-assistant-title">CaféQuick Barista</h2>
            <p>Your café guide, always here.</p>
        </div>
        <button id="cafe-assistant-close" type="button" aria-label="Close assistant">
            <span aria-hidden="true">×</span>
        </button>
    </header>

    <div
        id="cafe-assistant-messages"
        role="log"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Conversation">
        <p class="cafe-assistant-message assistant">
            Hello! ☕ I'm your CaféQuick Barista. I can help with café menus,
            ordering, your cart and demo payments. What can I help you find today?
        </p>
    </div>

    <form id="cafe-assistant-form">
        <label for="cafe-assistant-input">Ask CaféQuick a question</label>
        <input
            id="cafe-assistant-input"
            name="question"
            type="text"
            autocomplete="off"
            maxlength="500"
            placeholder="Ask your café guide..."
            required>
        <button type="submit">Send</button>
    </form>
</section>

<script src="{{ url_for('static', filename='js/cafe-assistant.js') }}" defer></script>
