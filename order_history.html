<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History</title>
  <style>
    /* General Styling */
    body {
      font-family: "Poppins", Arial, sans-serif;
      background-image: url("https://img.freepik.com/premium-photo/black-background-with-smoke-steam-smoke-is-thick-dark-steam-is-rising-from-ground_9083-27330.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      margin: 0;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      color: #1abc9c;
      text-shadow: 0px 0px 10px rgba(26, 188, 156, 0.8);
    }

    .order {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0px 2px 10px rgba(255, 255, 255, 0.2);
      text-align: left;
    }

    h3 {
      color: #f1c40f;
      margin-bottom: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
    }

    p.total {
      font-weight: bold;
      color: #e74c3c;
      margin-top: 10px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 1em;
      color: white;
      background: linear-gradient(90deg, #1abc9c, #16a085);
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(26, 188, 156, 0.5);
      transition: background 0.3s, transform 0.2s;
    }

    .back-link:hover {
      background: linear-gradient(90deg, #16a085, #1abc9c);
      transform: scale(1.05);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Order History</h1>

    {% if orders %}
    {% for order in orders %}
    <div class="order">
      <h3>Order for {{ order.user }}</h3>
      <ul>
        {% for item in order.items %}
        <li>{{ item.item }} - R{{ item.price }}</li>
        {% endfor %}
      </ul>
      <p class="total">Total: R{{ order.total }}</p>
    </div>
    {% endfor %}
    {% else %}
    <p>No past orders found.</p>
    {% endif %}

    <a href="{{ url_for('index') }}" class="back-link">Back to Home</a>
  </div>

</body>

</html>
